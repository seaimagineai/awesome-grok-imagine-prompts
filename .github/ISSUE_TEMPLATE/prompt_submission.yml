name: Submit a Grok Imagine prompt
description: Propose an original or authorized adapted prompt, with its test status
title: "[Prompt] "
labels:
  - prompt-submission
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing. Submit one original prompt or authorized adaptation at a time. Retain source attribution and license or permission evidence. Do not import content without permission or remove creator credits.

  - type: dropdown
    id: test_status
    attributes:
      label: Verification status
      options:
        - Untested creative brief
        - Author-reported result (not independently reproduced)
        - Tested by submitter (settings and results below)
    validations:
      required: true

  - type: textarea
    id: provenance
    attributes:
      label: Source, creator and permission
      description: For original work say so. For adaptations provide the original URL, creator, license or permission basis, and what changed. Media rights must be documented separately.
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Prompt title
      description: Use a descriptive, searchable title without third-party brand names.
      placeholder: Rainy window bakery product film
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Generation mode
      options:
        - Text-to-video
        - Image-to-video
        - Reference-to-video
        - Video edit
        - Video extension
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Prompt and dialogue language
      placeholder: English; dialogue in Brazilian Portuguese
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Production goal
      description: Describe audience, destination, duration, aspect ratio, and why this scenario is useful.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Reference roles
      description: List each input and its single role. Do not include private or expiring URLs.
      placeholder: "<IMAGE_0>: fictional character identity; <IMAGE_1>: garment construction"

  - type: textarea
    id: prompt
    attributes:
      label: Complete prompt
      description: Include opening frame/source lock, action, camera, physics, audio, continuity, exclusions, and final state.
      render: text
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Model, provider and settings
      description: Record the actual model identifier when known and the provider separately. If untested, label these as intended settings.
      placeholder: "Status: untested; intended model: grok-imagine-video-1.5; provider: SeaImagine; duration: 8s; aspect ratio: 16:9"
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: Result and iteration notes
      description: For tested work, explain successes, failures and changes. For untested work, state that clearly and describe the planned checks. Link only to media you can share.
    validations:
      required: true

  - type: checkboxes
    id: rights
    attributes:
      label: Originality and rights
      options:
        - label: This is my original prompt or an authorized adaptation with its source and license or permission recorded in this submission.
          required: true
        - label: I have the right to share every linked reference and output asset.
          required: true
        - label: The submission does not contain private data, unauthorized likenesses, protected characters, hidden promotion, or undisclosed affiliate links.
          required: true
        - label: I understand that maintainers may edit the prompt for clarity, safety, formatting, and consistency.
          required: true
